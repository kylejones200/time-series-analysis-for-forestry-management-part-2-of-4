[project]
name = "forestry-ts-part2"
version = "0.2.0"
description = "Oregon Coast Range Douglas-fir panel forecasting with LightGBM (Part 2 of 4)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyarrow>=12.0.0",
    "pyfia>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "signalplot>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
forestry-fetch = "forestry_ts.data:main"
forestry-run = "forestry_ts.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forestry_ts"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
